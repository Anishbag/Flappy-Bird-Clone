<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #game {
            width: 400px;
            height: 600px;
            background: skyblue;
            position: relative;
            overflow: hidden;
        }

        #bird {
            width: 40px;
            height: 40px;
            background: yellow;
            border-radius: 50%;
            position: absolute;
            left: 80px;
            top: 250px;
        }

        .pipe {
            width: 60px;
            background: green;
            position: absolute;
            right: -60px;
        }
    </style>
</head>
<body>

<div id="game">
    <div id="bird"></div>
</div>

<script src="script.js"></script>
<footer>
    Copy write By AnishBag
    <button>Submit</button>
</footer>
</body>
</html>
